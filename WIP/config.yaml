maglim_fluxlim_superset: 
  sample_name: &maglim_fluxlim_superset maglim_fluxlim_superset
  verbose: true
  version: &maglim_fluxlim_superset_date "17Jul2026"
  description: "Storing superset data to create a MagLim/fluxLim like sample on LSST i-band. Also imposing relevent photo-z cuts. Further magLim i-photo-z selection will need to be appiled later. This catalog will be scanned to create maglim photoz-magnitude cut and then pass the MagLim sample to Boyan for SOMPZ run. At the e2e stage, gold and pgauss are the same."
  outdir: "package_validation/survey_all/photmtry_all/maglim_fluxlim_superset"
  foutname: [*maglim_fluxlim_superset, "_", *maglim_fluxlim_superset_date]
  downsample:
    fraction: null
    factor: null
  survey:
    all: true
    which: []
  photometry_type:
    all: true
    which: []
  native_prop:
    nonflux_prop:
      all: true
      which: ["ra", "dec", "spec_z", "phot_z"]
    filters:
      - {col: "phot_z", type: "range", bounds: [0.0, 1.4], inequality: [">=", "<"]}
  flux_cols:
    all: true
    which: []
    filters: []
    flux_err_cols: true
  derived_prop:
    get_mags:
      all: true
      which: []
      filters:
        - {col: "i", photometry_type: "gold", quantity: "mag", survey: "lsst", type: "range", bounds: [17,24], inequality: [">","<="]}
      mag_err_cols: true

