lsst_gold_all_rows_cut_on_ug_noCut_on_r: 
  sample_name: &lsst_gold_all_rows_cut_on_ug_noCut_on_r lsst_gold_all_rows_cut_on_ug_noCut_on_r
  verbose: true
  version: &lsst_gold_all_rows_cut_on_ug_noCut_on_r_date "16Jul2026"
  description: "using lsst gold catalog to create an r-band superset of earlier run lsst_gold_all_rows_noRedshiftCut. This is to test that filters on even those bands work fine that aren't being queried for storing. The idea is to save magnitudes in ugr bands, but not apply any cut on r-band. Then use this column to apply r-band threshold by hand and compare with the smaller dataset created earlier."
  outdir: "package_validation/lsst/gold/ugr_cut_on_only_ug"
  foutname: [*lsst_gold_all_rows_cut_on_ug_noCut_on_r, "_", *lsst_gold_all_rows_cut_on_ug_noCut_on_r_date]
  
  downsample:
    fraction: null
    factor: null

  survey:
    all: false
    which: "lsst"

  photometry_type:
    all: false
    which: "gold"

  native_prop:
    nonflux_prop:
      all: false
      which: ["ra", "dec", "spec_z", "phot_z"]

  flux_cols:
    all: false
    which: []
    filters: []
    flux_err_cols: false

  derived_prop:
    get_mags:
      all: false
      which: ["u", "g", "r"]
      filters:
        - {col: "u", photometry_type: "gold", quantity: "mag", survey: "lsst", type: "max", value: 24, inequality: "<="}
        - {col: "g", photometry_type: "gold", quantity: "mag", survey: "lsst", type: "max", value: 24, inequality: "<="}
      mag_err_cols: false

